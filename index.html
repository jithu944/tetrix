<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TETRIS NEO | compact</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Share+Tech+Mono&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 20% 30%, #030318, #01010b);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    touch-action: none;
  }

  /* MAIN CONTAINER - REDUCED OVERALL SIZE */
  .game-container {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  /* unified card style */
  .card {
    background: rgba(4, 6, 22, 0.75);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(0, 220, 255, 0.25);
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4), 0 0 12px rgba(0,200,255,0.2);
    transition: all 0.2s ease;
  }

  /* --- SCREENS --- */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s, visibility 0.3s;
    z-index: 10;
  }
  .screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* compact logo */
  .logo-compact {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #0ff, #f0f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 10px #0ff4;
    margin-bottom: 6px;
  }

  .sub {
    font-size: 0.6rem;
    letter-spacing: 2px;
    color: #0ff9;
    margin-bottom: 16px;
  }

  /* menu panel - tighter */
  .menu-panel {
    width: min(280px, 82vw);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: rgba(6, 8, 28, 0.85);
    border-radius: 28px;
    border: 1px solid rgba(0, 230, 255, 0.4);
  }

  .menu-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .menu-label {
    font-size: 0.7rem;
    letter-spacing: 1px;
    color: #0ffa;
    text-transform: uppercase;
  }
  select, .btn-small {
    background: #0a0f2a;
    border: 1px solid #0ff6;
    border-radius: 30px;
    color: #eef;
    font-family: monospace;
    padding: 5px 10px;
    font-size: 0.7rem;
    outline: none;
    cursor: pointer;
  }
  .btn {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    letter-spacing: 1.2px;
    border: none;
    border-radius: 40px;
    padding: 8px 0;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.1s linear;
  }
  .btn-primary {
    background: linear-gradient(95deg, #0cf, #06f);
    color: #010;
    box-shadow: 0 0 8px #0cf8;
  }
  .btn-secondary {
    background: linear-gradient(95deg, #f0a, #c0f);
    color: white;
  }
  .btn-ghost {
    background: rgba(0,200,255,0.1);
    border: 1px solid #0cf6;
    color: #0cf;
  }
  .hs-micro {
    text-align: center;
    font-size: 0.65rem;
    color: #ffea80;
    margin-top: 8px;
  }

  /* GAME LAYOUT - more compact board */
  #game-screen {
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .game-layout {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(0,0,0,0.3);
    border-radius: 24px;
    padding: 8px 12px;
    backdrop-filter: blur(4px);
  }

  /* smaller side panels */
  .side-info {
    background: rgba(2, 3, 15, 0.7);
    border-radius: 16px;
    padding: 8px 8px;
    min-width: 68px;
    text-align: center;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(0, 200, 255, 0.3);
  }
  .side-info h4 {
    font-size: 0.5rem;
    letter-spacing: 2px;
    color: #0ff;
    margin: 0 0 6px 0;
  }
  .stat-val {
    font-size: 1rem;
    font-weight: bold;
    color: #eef;
  }
  .stat-label {
    font-size: 0.45rem;
    text-transform: uppercase;
    color: #0ff9;
  }
  canvas#game-canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 0 0 1px #0cf3, 0 4px 20px rgba(0,0,0,0.5);
    background: #010112;
  }
  .mini-canvas {
    background: #020212;
    border-radius: 8px;
    display: block;
    margin: 2px auto;
  }

  /* HOLD / NEXT compact */
  .row-mini {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 6px;
  }

  /* MOBILE BOTTOM TOUCH (compact) */
  .touch-bar {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
    border-radius: 60px;
    padding: 6px 12px;
    margin-top: 8px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }
  .touch-btn {
    background: rgba(0, 230, 255, 0.12);
    border: 1px solid #0cf6;
    border-radius: 48px;
    color: #0ff;
    font-weight: bold;
    font-size: 1rem;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.05s linear;
    touch-action: manipulation;
    cursor: pointer;
  }
  .touch-btn:active {
    background: #0cf8;
    color: #000;
    transform: scale(0.92);
  }
  .touch-small {
    width: 40px;
    height: 40px;
    font-size: 0.8rem;
  }

  /* OVERLAYS */
  .overlay-panel {
    background: rgba(4, 6, 25, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 20px 24px;
    width: min(280px, 85vw);
    text-align: center;
    border: 1px solid #0cf6;
  }
  .result-item {
    background: #0a0e1e;
    border-radius: 18px;
    padding: 8px;
  }
  .result-item .val { font-size: 1rem; color: #0ff; }
  .result-item .lbl { font-size: 0.55rem; }

  /* notifications */
  #notif-area {
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .notif {
    background: #0cfc;
    color: #011;
    font-weight: bold;
    padding: 4px 14px;
    border-radius: 40px;
    font-size: 0.7rem;
    font-family: monospace;
    animation: fadeUp 0.9s ease forwards;
  }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(12px);}
    20% { opacity: 1; transform: translateY(0);}
    80% { opacity: 1;}
    100% { opacity: 0; transform: translateY(-20px);}
  }

  #achievement-toast {
    position: fixed;
    bottom: 18px;
    right: 10px;
    background: #0f1125ee;
    backdrop-filter: blur(8px);
    border-left: 4px solid gold;
    border-radius: 24px;
    padding: 8px 14px;
    transform: translateX(120%);
    transition: 0.3s cubic-bezier(0.2, 1, 0.3, 1);
    z-index: 120;
    font-size: 0.7rem;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #achievement-toast.show { transform: translateX(0); }

  /* fullscreen icon tiny */
  #fs-btn {
    position: fixed;
    bottom: 12px;
    right: 12px;
    background: #0cf2;
    border-radius: 40px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
    cursor: pointer;
    z-index: 50;
    font-size: 1rem;
    color: #0cf;
    border: 1px solid #0cf7;
  }

  @media (max-width: 550px) {
    .game-layout { gap: 6px; padding: 6px 8px; }
    .side-info { padding: 4px 6px; min-width: 55px; }
    .touch-btn { width: 42px; height: 42px; font-size: 0.9rem; }
    .stat-val { font-size: 0.85rem; }
  }
  @media (max-width: 420px) {
    .touch-btn { width: 38px; height: 38px; }
    .side-info .stat-val { font-size: 0.75rem; }
  }
</style>
</head>
<body>

<div id="notif-area"></div>
<div id="achievement-toast">🏆 <span id="achieve-msg"></span></div>
<div id="fs-btn">⛶</div>

<!-- START -->
<div id="start-screen" class="screen">
  <div class="menu-panel" style="align-items:center;">
    <div class="logo-compact">TETRIS NEO</div>
    <div class="sub">◈ COMPACT EDITION ◈</div>
    <div class="menu-row"><span class="menu-label">MODE</span>
      <select id="modeSelect">
        <option value="classic">Classic</option>
        <option value="marathon">Marathon</option>
        <option value="sprint">Sprint (40L)</option>
        <option value="ultra">Ultra (2min)</option>
      </select>
    </div>
    <div class="menu-row"><span class="menu-label">DIFFICULTY</span>
      <select id="diffSelect"><option value="1">Easy</option><option value="2" selected>Normal</option><option value="3">Hard</option></select>
    </div>
    <div class="menu-row"><span class="menu-label">SOUND</span><button id="soundToggleBtn" class="btn-small">🔊 ON</button></div>
    <button id="playGameBtn" class="btn btn-primary" style="margin-top:4px;">▶ PLAY</button>
    <div style="display:flex;gap:10px; margin-top:6px;">
      <button id="statsMenuBtn" class="btn-ghost" style="padding:4px 14px; font-size:0.65rem;">📊 STATS</button>
      <button id="settingsMenuBtn" class="btn-ghost" style="padding:4px 14px; font-size:0.65rem;">⚙ SETTINGS</button>
    </div>
    <div class="hs-micro">🏆 BEST: <span id="hsBestSpan">0</span></div>
  </div>
</div>

<!-- GAME -->
<div id="game-screen" class="screen hidden">
  <div class="game-layout">
    <!-- LEFT PANEL (HOLD) -->
    <div class="side-info">
      <h4>HOLD</h4>
      <canvas id="holdCanvas" width="60" height="60" style="width:60px;height:60px" class="mini-canvas"></canvas>
    </div>
    <!-- MAIN BOARD -->
    <canvas id="tetrisCanvas" width="300" height="600" style="width:auto; height:auto; max-width:min(70vw,300px);"></canvas>
    <!-- RIGHT PANEL (NEXT+SCORE) -->
    <div style="display:flex; flex-direction:column; gap:8px;">
      <div class="side-info">
        <h4>NEXT</h4>
        <canvas id="next0" width="50" height="40" style="width:50px;height:40px"></canvas>
        <canvas id="next1" width="50" height="34" style="width:50px;height:34px"></canvas>
        <canvas id="next2" width="50" height="34" style="width:50px;height:34px"></canvas>
      </div>
      <div class="side-info"><h4>SCORE</h4><div class="stat-val" id="gameScore">0</div><div class="stat-label">pts</div></div>
      <div class="side-info"><h4>LINES</h4><div class="stat-val" id="gameLines">0</div></div>
      <div class="side-info"><h4>LEVEL</h4><div class="stat-val" id="gameLevel">1</div></div>
      <div class="side-info"><h4>COMBO</h4><div class="stat-val" id="gameCombo">—</div></div>
    </div>
  </div>
  <!-- compact touch controls -->
  <div class="touch-bar">
    <button class="touch-btn" id="touchLeft">◀</button>
    <button class="touch-btn" id="touchRight">▶</button>
    <button class="touch-btn" id="touchRotate">↻</button>
    <button class="touch-btn" id="touchSoft">▼</button>
    <button class="touch-btn" id="touchHard">⬇︎⬇︎</button>
    <button class="touch-btn touch-small" id="touchHold">⤴︎</button>
    <button class="touch-btn touch-small" id="touchPause">⏸</button>
  </div>
</div>

<!-- PAUSE -->
<div id="pause-screen" class="screen hidden">
  <div class="overlay-panel"><div class="logo-compact" style="font-size:1.5rem;">PAUSED</div>
    <button id="resumeBtn" class="btn btn-primary" style="margin-top:12px;">RESUME</button>
    <button id="pauseRestartBtn" class="btn btn-ghost">RESTART</button>
    <button id="pauseMenuBtn" class="btn btn-secondary">MAIN MENU</button>
  </div>
</div>

<!-- GAMEOVER -->
<div id="gameover-screen" class="screen hidden">
  <div class="overlay-panel"><div class="logo-compact">GAME OVER</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0">
      <div class="result-item"><div class="val" id="goScore">0</div><div class="lbl">SCORE</div></div>
      <div class="result-item"><div class="val" id="goLevel">1</div><div class="lbl">LEVEL</div></div>
      <div class="result-item"><div class="val" id="goLines">0</div><div class="lbl">LINES</div></div>
      <div class="result-item"><div class="val" id="goTime">0:00</div><div class="lbl">TIME</div></div>
    </div>
    <div id="newHsMsg" style="color:gold; font-size:0.7rem; margin-bottom:8px; display:none;">✨ NEW HIGHSCORE ✨</div>
    <button id="goAgainBtn" class="btn btn-primary">PLAY AGAIN</button>
    <button id="goMenuBtn" class="btn btn-ghost" style="margin-top:8px;">MENU</button>
  </div>
</div>

<!-- STATS & SETTINGS (compact)-->
<div id="stats-screen" class="screen hidden">
  <div class="overlay-panel" style="max-height:70vh; overflow-y:auto;"><div class="logo-compact" style="font-size:1.3rem;">STATS</div>
    <div id="statsGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:12px 0;"></div>
    <div style="font-size:0.55rem; color:#0cf;">TOP SCORES</div>
    <div id="topScoresList" style="font-size:0.7rem; margin:8px 0;"></div>
    <button id="statsCloseBtn" class="btn btn-ghost">CLOSE</button>
  </div>
</div>
<div id="settings-screen" class="screen hidden">
  <div class="overlay-panel">
    <div class="logo-compact" style="font-size:1.3rem;">SETTINGS</div>
    <div class="menu-row"><span>SFX VOL</span><input type="range" id="sfxRange" min="0" max="100" value="70"></div>
    <div class="menu-row"><span>GRAPHICS</span><select id="graphicsSelect"><option value="low">Low</option><option value="medium" selected>Medium</option></select></div>
    <button id="saveSettingsBtn" class="btn btn-primary" style="margin-top:12px;">SAVE</button>
    <button id="closeSettingsBtn" class="btn btn-ghost">BACK</button>
  </div>
</div>

<script>
  (function(){
    // ---------- CONSTANTS (reduced footprint) ----------
    const COLS=10, ROWS=20;
    const TETROMINOS = {
      I: { cells:[[0,1],[1,1],[2,1],[3,1]], color:"#0cf", grid:4 },
      O: { cells:[[1,0],[2,0],[1,1],[2,1]], color:"#fe3", grid:4 },
      T: { cells:[[0,1],[1,1],[2,1],[1,0]], color:"#d4f", grid:3 },
      S: { cells:[[1,0],[2,0],[0,1],[1,1]], color:"#3f6", grid:3 },
      Z: { cells:[[0,0],[1,0],[1,1],[2,1]], color:"#f46", grid:3 },
      J: { cells:[[0,0],[0,1],[1,1],[2,1]], color:"#38f", grid:3 },
      L: { cells:[[2,0],[0,1],[1,1],[2,1]], color:"#f90", grid:3 }
    };
    const SCORE_TABLE = {1:100,2:300,3:500,4:800};
    const SPEEDS = [820,720,620,520,450,380,310,250,200,160,130,100,80,70,60,50,45,40,35,30];
    
    // Storage
    let stats = JSON.parse(localStorage.getItem('tet_stats')) || { played:0, highScore:0, totalLines:0, tetrises:0, tspins:0, bestLevel:1 };
    let highScores = JSON.parse(localStorage.getItem('tet_scores')) || [];
    let achievements = new Set(JSON.parse(localStorage.getItem('tet_ach')) || []);
    let settings = JSON.parse(localStorage.getItem('tet_settings')) || { sfx:70, graphics:'medium' };
    
    function saveStats() { localStorage.setItem('tet_stats', JSON.stringify(stats)); }
    function saveScores() { localStorage.setItem('tet_scores', JSON.stringify(highScores.slice(0,8))); }
    function saveAchievements() { localStorage.setItem('tet_ach', JSON.stringify([...achievements])); }
    
    // Audio mock (simple beep simulation)
    const sfx = { move:()=>{}, rotate:()=>{}, drop:()=>{}, clear:()=>{}, tspin:()=>{}, levelup:()=>{}, gameover:()=>{}, harddrop:()=>{} };
    let soundEnabled = true;
    function beep(freq, duration=0.05, vol=0.3){ if(!soundEnabled)return; try{ let ctx=new (window.AudioContext||window.webkitAudioContext)(); let o=ctx.createOscillator(); let g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=freq; g.gain.value=vol*settings.sfx/100; o.type='sine'; o.start(); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+duration); o.stop(ctx.currentTime+duration); setTimeout(()=>ctx.close(),200); }catch(e){} }
    sfx.move=()=>beep(320,0.03,0.2); sfx.rotate=()=>beep(440,0.04,0.25); sfx.drop=()=>beep(260,0.07,0.3); sfx.harddrop=()=>{ beep(160,0.1,0.4); beep(80,0.12,0.3); };
    sfx.clear=(cnt)=>{ beep(390,0.08,0.3); if(cnt>=3) beep(520,0.12,0.4); };
    sfx.tspin=()=>{ beep(680,0.1,0.5); beep(880,0.12,0.4); };
    sfx.levelup=()=>{ beep(523,0.1); beep(659,0.1); beep(784,0.12); };
    sfx.gameover=()=>{ beep(260,0.4); beep(200,0.5); };
    
    function showNotif(msg, col="#0cf"){ let d=document.getElementById('notif-area'); let e=document.createElement('div'); e.className='notif'; e.style.background=col; e.innerText=msg; d.appendChild(e); setTimeout(()=>e.remove(),1000);}
    function showAchievement(name){ let toast=document.getElementById('achievement-toast'); document.getElementById('achieve-msg').innerText=name; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2500); }
    function unlockAchievement(id, name){ if(!achievements.has(id)){ achievements.add(id); saveAchievements(); showAchievement(name); return true;} return false;}
    
    // ---------- GAME ENGINE (compact) ----------
    let gameActive = null;
    class TetrisEngine {
      constructor(canvasId, mode, difficulty){
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.mode = mode; this.difficulty=parseInt(difficulty);
        this.board=Array(ROWS).fill().map(()=>Array(COLS).fill(null));
        this.nextQ = []; this.holdPiece=null; this.canHold=true;
        this.score=0; this.lines=0; this.level=1; this.combo=-1;
        this.gameOverFlag=false; this.paused=false; this.startTime=Date.now();
        this.lastTime=0; this.dropAcc=0; this.lockTimer=null;
        this.nextQ.push(this.randomPiece()); this.nextQ.push(this.randomPiece()); this.nextQ.push(this.randomPiece());
        this.spawnNew();
        this.resizeCanvas();
        this.drawAll();
        requestAnimationFrame((t)=>this.gameLoop(t));
      }
      randomPiece(){ let keys=Object.keys(TETROMINOS); return keys[Math.floor(Math.random()*keys.length)]; }
      spawnNew(){
        let type = this.nextQ.shift(); this.nextQ.push(this.randomPiece());
        let def = TETROMINOS[type];
        this.current = { type, cells: def.cells.map(c=>[...c]), x:Math.floor(COLS/2)-Math.floor(def.grid/2), y:0, grid:def.grid, rotation:0 };
        if(this.collision(0,0)){ this.gameOver(); return; }
        this.canHold=true; this.drawUI();
      }
      collision(dx,dy, cells=null){ let c=cells||this.current.cells; for(let [cx,cy] of c){ let nx=this.current.x+cx+dx, ny=this.current.y+cy+dy; if(nx<0||nx>=COLS||ny>=ROWS) return true; if(ny>=0 && this.board[ny][nx]) return true; } return false; }
      mergePiece(){ this.current.cells.forEach(([cx,cy])=>{ let x=this.current.x+cx, y=this.current.y+cy; if(y>=0) this.board[y][x]=this.current.type; }); let cleared=this.clearLines(); this.updateScoreAndLevel(cleared); this.spawnNew(); }
      clearLines(){ let rowsCleared=[]; for(let r=0;r<ROWS;r++){ if(this.board[r].every(v=>v!==null)) rowsCleared.push(r); } if(rowsCleared.length===0){ this.combo=-1; return 0; } this.combo++; for(let r of rowsCleared){ for(let c=0;c<COLS;c++){ let col=this.board[r][c]; if(col) showNotif('🧩', '#0cf'); } } rowsCleared.reverse().forEach(r=>{ this.board.splice(r,1); this.board.unshift(Array(COLS).fill(null)); }); this.lines+=rowsCleared.length; return rowsCleared.length; }
      updateScoreAndLevel(cleared){
        if(cleared===0) return;
        let pts = SCORE_TABLE[cleared]||0; pts*=this.level;
        if(cleared===4){ showNotif('TETRIS!','#0cf'); stats.tetrises++; unlockAchievement('tetris','FIRST TETRIS'); }
        if(this.combo>0){ let bonus=50*this.combo*this.level; pts+=bonus; showNotif(`COMBO x${this.combo}`,'#fb3'); }
        this.score+=pts;
        let newLevel = Math.floor(this.lines/10)+this.difficulty; if(newLevel>this.level){ this.level=Math.min(newLevel,20); sfx.levelup(); showNotif(`LEVEL ${this.level}`,`#ff6`); }
        if(this.mode==='sprint' && this.lines>=40) this.gameWon=true, this.gameOver();
        if(this.mode==='ultra' && Date.now()-this.startTime>=120000) this.gameOver();
        this.drawUI();
      }
      rotatePiece(){ let old=this.current.cells; let n=this.current.grid; let newCells=this.current.cells.map(([x,y])=>[n-1-y, x]); if(!this.collision(0,0,newCells)){ this.current.cells=newCells; sfx.rotate(); } else { let kicks=[[-1,0],[1,0],[0,-1],[1,1],[-1,1]]; for(let [kx,ky] of kicks){ if(!this.collision(kx,ky,newCells)){ this.current.x+=kx; this.current.y+=ky; this.current.cells=newCells; sfx.rotate(); break; } } } this.drawAll(); }
      move(dx){ if(!this.collision(dx,0)){ this.current.x+=dx; sfx.move(); this.drawAll(); } else if(dx===0){ this.lockPiece(); } }
      softDrop(){ if(!this.collision(0,1)){ this.current.y++; this.score+=1; this.drawAll(); } else this.lockPiece(); }
      hardDrop(){ while(!this.collision(0,1)) this.current.y++; sfx.harddrop(); this.lockPiece(); }
      lockPiece(){ if(this.lockTimer) clearTimeout(this.lockTimer); this.mergePiece(); this.drawAll(); }
      holdCurrent(){ if(!this.canHold) return; sfx.move(); let curType=this.current.type; if(this.holdPiece===null){ this.spawnNew(); }else{ let def=TETROMINOS[this.holdPiece]; this.current={ type:this.holdPiece, cells:def.cells.map(c=>[...c]), x:Math.floor(COLS/2)-Math.floor(def.grid/2), y:0, grid:def.grid, rotation:0 }; } this.holdPiece=curType; this.canHold=false; this.drawHold(); this.drawAll(); }
      drawAll(){ this.drawBoard(); this.drawPiece(); this.drawGhost(); }
      drawBoard(){ let cs=this.canvas.width/COLS; this.ctx.fillStyle='#010012'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height); for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ let type=this.board[r][c]; if(type){ let col=TETROMINOS[type].color; this.ctx.fillStyle=col; this.ctx.shadowBlur= settings.graphics==='high'?4:0; this.ctx.fillRect(c*cs,r*cs,cs-0.5,cs-0.5); this.ctx.fillStyle='rgba(255,255,255,0.2)'; this.ctx.fillRect(c*cs+2,r*cs+2,cs-5,cs-5); } } this.ctx.shadowBlur=0; }
      drawPiece(){ let cs=this.canvas.width/COLS; for(let [cx,cy] of this.current.cells){ let x=(this.current.x+cx)*cs, y=(this.current.y+cy)*cs; if(y>=0){ let col=TETROMINOS[this.current.type].color; this.ctx.fillStyle=col; this.ctx.fillRect(x,y,cs-0.8,cs-0.8); this.ctx.fillStyle='white'; this.ctx.fillRect(x+2,y+2,cs-5,cs-5); } } }
      drawGhost(){ let dy=0; while(!this.collision(0,dy+1)) dy++; let cs=this.canvas.width/COLS; for(let [cx,cy] of this.current.cells){ let x=(this.current.x+cx)*cs, y=(this.current.y+cy+dy)*cs; if(y>=0 && y<this.canvas.height){ this.ctx.strokeStyle=TETROMINOS[this.current.type].color+'aa'; this.ctx.lineWidth=1.5; this.ctx.strokeRect(x+1,y+1,cs-3,cs-3); } } }
      drawUI(){ document.getElementById('gameScore').innerText=this.score; document.getElementById('gameLines').innerText=this.lines; document.getElementById('gameLevel').innerText=this.level; document.getElementById('gameCombo').innerText=this.combo>0?`x${this.combo}`:'—'; this.drawNext(); this.drawHold(); }
      drawHold(){ let c=document.getElementById('holdCanvas'); if(!c)return; let ctx=c.getContext('2d'); ctx.clearRect(0,0,60,60); if(this.holdPiece){ let def=TETROMINOS[this.holdPiece]; let sz=14; let off=30-def.grid*sz/2; for(let [x,y] of def.cells){ ctx.fillStyle=def.color; ctx.fillRect(off+x*sz,off+y*sz,sz-1,sz-1); } } }
      drawNext(){ for(let i=0;i<3;i++){ let can=document.getElementById(`next${i}`); if(can){ let type=this.nextQ[i]; let ctx=can.getContext('2d'); ctx.clearRect(0,0,can.width,can.height); if(type){ let def=TETROMINOS[type]; let sz=Math.min(12, can.width/def.grid); let offX=(can.width-(def.grid*sz))/2; let offY=(can.height-(def.grid*sz))/2; for(let [x,y] of def.cells){ ctx.fillStyle=def.color; ctx.fillRect(offX+x*sz,offY+y*sz,sz-1,sz-1); } } } } }
      gameLoop(ts){ if(this.gameOverFlag) return; if(!this.paused){ let delta=Math.min(50,ts-this.lastTime); this.lastTime=ts; this.dropAcc+=delta; let speed=SPEEDS[Math.min(this.level-1,SPEEDS.length-1)]||70; if(this.dropAcc>=speed){ this.dropAcc=0; if(!this.collision(0,1)) this.current.y++; else this.lockPiece(); this.drawAll(); } this.drawAll(); } requestAnimationFrame((t)=>this.gameLoop(t)); }
      gameOver(win=false){ this.gameOverFlag=true; sfx.gameover(); stats.played++; if(this.score>stats.highScore){ stats.highScore=this.score; unlockAchievement('highscore','HIGH SCORE'); } if(this.level>stats.bestLevel) stats.bestLevel=this.level; stats.totalLines+=this.lines; saveStats(); highScores.push({score:this.score,lines:this.lines,level:this.level,mode:this.mode}); highScores.sort((a,b)=>b.score-a.score); highScores=highScores.slice(0,8); saveScores(); document.getElementById('goScore').innerText=this.score; document.getElementById('goLevel').innerText=this.level; document.getElementById('goLines').innerText=this.lines; let secs=Math.floor((Date.now()-this.startTime)/1000); document.getElementById('goTime').innerText=`${Math.floor(secs/60)}:${(secs%60).toString().padStart(2,'0')}`; let isNew= highScores.length && highScores[0].score===this.score; document.getElementById('newHsMsg').style.display=isNew?'block':'none'; showScreen('gameover-screen'); }
      resizeCanvas(){ let parent=this.canvas.parentElement; let maxDim=Math.min(window.innerWidth*0.5,300); this.canvas.width=COLS*30; this.canvas.height=ROWS*30; this.canvas.style.width=`${maxDim}px`; this.canvas.style.height='auto'; }
      pauseToggle(){ if(this.paused){ this.paused=false; showScreen('game-screen'); }else{ this.paused=true; showScreen('pause-screen'); } }
      restart(){ this.gameOverFlag=true; startGameInstance(); }
    }
    
    let currentGame=null;
    function startGameInstance(){ if(currentGame) currentGame.gameOverFlag=true; let mode=document.getElementById('modeSelect').value; let diff=document.getElementById('diffSelect').value; currentGame = new TetrisEngine('tetrisCanvas', mode, diff); showScreen('game-screen'); }
    function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    
    // global bindings
    document.getElementById('playGameBtn').onclick=()=>startGameInstance();
    document.getElementById('resumeBtn').onclick=()=>{ if(currentGame) currentGame.paused=false; showScreen('game-screen'); };
    document.getElementById('pauseRestartBtn').onclick=()=>{ startGameInstance(); };
    document.getElementById('pauseMenuBtn').onclick=()=>{ if(currentGame)currentGame.gameOverFlag=true; showScreen('start-screen'); };
    document.getElementById('goAgainBtn').onclick=()=>startGameInstance();
    document.getElementById('goMenuBtn').onclick=()=>showScreen('start-screen');
    
    // touch controls
    function bindTouch(id, cb){ let el=document.getElementById(id); if(el){ el.addEventListener('click',(e)=>{ e.preventDefault(); cb(); }); el.addEventListener('touchstart',(e)=>{ e.preventDefault(); cb(); },{passive:false}); } }
    bindTouch('touchLeft',()=>currentGame?.move(-1));
    bindTouch('touchRight',()=>currentGame?.move(1));
    bindTouch('touchRotate',()=>currentGame?.rotatePiece());
    bindTouch('touchSoft',()=>currentGame?.softDrop());
    bindTouch('touchHard',()=>currentGame?.hardDrop());
    bindTouch('touchHold',()=>currentGame?.holdCurrent());
    bindTouch('touchPause',()=>currentGame?.pauseToggle());
    window.addEventListener('keydown',(e)=>{ if(!currentGame||currentGame.paused)return; if(e.key==='ArrowLeft') currentGame.move(-1); if(e.key==='ArrowRight') currentGame.move(1); if(e.key==='ArrowUp') currentGame.rotatePiece(); if(e.key==='ArrowDown') currentGame.softDrop(); if(e.key===' ') { e.preventDefault(); currentGame.hardDrop(); } if(e.key==='c'||e.key==='C') currentGame.holdCurrent(); if(e.key==='p'||e.key==='P') currentGame.pauseToggle(); });
    
    // stats & settings
    function refreshStatsUI(){ let s=stats; let grid=document.getElementById('statsGrid'); grid.innerHTML=`<div class="result-item"><div class="val">${s.played}</div><div class="lbl">PLAYED</div></div><div class="result-item"><div class="val">${s.highScore}</div><div class="lbl">BEST</div></div><div class="result-item"><div class="val">${s.totalLines}</div><div class="lbl">LINES</div></div><div class="result-item"><div class="val">${s.tetrises||0}</div><div class="lbl">TETRIS</div></div>`; let listDiv=document.getElementById('topScoresList'); listDiv.innerHTML=highScores.map((sc,i)=>`<div>#${i+1} ${sc.score}  (${sc.mode}) L${sc.level}</div>`).join('')||'<div>—</div>'; }
    document.getElementById('statsMenuBtn').onclick=()=>{ refreshStatsUI(); showScreen('stats-screen'); };
    document.getElementById('statsCloseBtn').onclick=()=>showScreen('start-screen');
    document.getElementById('settingsMenuBtn').onclick=()=>{ document.getElementById('sfxRange').value=settings.sfx; document.getElementById('graphicsSelect').value=settings.graphics; showScreen('settings-screen'); };
    document.getElementById('saveSettingsBtn').onclick=()=>{ settings.sfx=parseInt(document.getElementById('sfxRange').value); settings.graphics=document.getElementById('graphicsSelect').value; localStorage.setItem('tet_settings',JSON.stringify(settings)); showScreen('start-screen'); };
    document.getElementById('closeSettingsBtn').onclick=()=>showScreen('start-screen');
    let soundOn=true; document.getElementById('soundToggleBtn').onclick=()=>{ soundOn=!soundOn; soundEnabled=soundOn; document.getElementById('soundToggleBtn').innerText=soundOn?'🔊 ON':'🔇 OFF'; };
    function updateHsDisplay(){ let hs=highScores.length?highScores[0].score:0; document.getElementById('hsBestSpan').innerText=hs; }
    updateHsDisplay(); setInterval(()=>{ updateHsDisplay(); refreshStatsUI(); },1000);
    document.getElementById('fs-btn').addEventListener('click',()=>{ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); });
    showScreen('start-screen');
  })();
</script>
